<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관심 기사 다이제스트</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
:root{
 --blue-500:#3182F6;--blue-50:#E8F3FF;
 --grey-900:#191F28;--grey-700:#4E5968;--grey-600:#6B7684;--grey-500:#8B95A1;
 --grey-200:#E5E8EB;--grey-100:#F2F4F6;--white:#FFFFFF;
 --bg:var(--grey-100);--card:var(--white);--fg:var(--grey-900);--fg2:var(--grey-700);
 --fg3:var(--grey-500);--line:var(--grey-200);--accent:var(--blue-500);--accent-weak:var(--blue-50);
 --shadow:0 1px 2px rgba(2,32,71,.04),0 1px 1px rgba(2,32,71,.04);
 --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#17171C;--card:#202027;--fg:#FFFFFF;--fg2:#C3C3C6;--fg3:#9E9EA4;--line:#3C3C47;
 --accent:#3485FA;--accent-weak:#202C4D;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
 font-size:15px;line-height:1.5;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:8px;height:56px;margin-bottom:8px}
.back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
 border-radius:12px;color:var(--fg);transition:background .12s var(--ease)}
.back:active{background:rgba(0,0,0,.08)}
h1{font-size:28px;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin:8px 0 4px}
.sub{color:var(--fg3);font-size:13px;margin:0 0 24px}
h2{font-size:20px;font-weight:700;line-height:1.35;letter-spacing:-.015em;margin:32px 4px 12px}
.card{background:var(--card);border-radius:24px;padding:24px;margin:0 0 12px;box-shadow:var(--shadow)}
.summary{background:var(--accent-weak)}
.summary h2{margin:0 0 12px;font-size:18px;color:var(--accent)}
.summary ol{margin:0;padding-left:20px;color:var(--fg);font-size:15px}
.summary li+li{margin-top:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;
 background:var(--accent-weak);color:var(--accent);font-size:12px;font-weight:600}
.date{color:var(--fg3);font-size:12px;font-weight:500;margin-left:auto}
.card h3{font-size:18px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin:0 0 8px}
.card p{color:var(--fg2);margin:0 0 20px}
.btn{display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;
 background:var(--bg);color:var(--fg);font-size:15px;font-weight:600;transition:background .12s var(--ease)}
.btn:active{background:var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--card);
 border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow)}
.row .t{font-size:17px;font-weight:600}
.row .s{color:var(--fg3);font-size:13px}
.row .r{margin-left:auto;color:var(--fg3)}
.empty{color:var(--fg3);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><h1>관심 기사 다이제스트</h1><p class="sub">AI 에이전트, 업무 자동화, 클로드 소식을 날짜별로 모아요</p><a class="row" href="2026-11-11.html"><div><div class="t">2026-11-11</div><div class="s">기사 4건</div></div><span class="r"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></a></main></body></html>
